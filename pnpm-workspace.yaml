catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# adapter-cloudflare pulls in esbuild and workerd; pnpm >=11 blocks install
# scripts until a package is listed here (ERR_PNPM_IGNORED_BUILDS otherwise).
allowBuilds:
  esbuild: true
  workerd: true
