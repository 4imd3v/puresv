name: release

# Publishes with trusted publishing (OIDC): no NPM_TOKEN anywhere, and npm
# attaches a provenance attestation automatically. Requires the package's
# trusted publisher on npmjs.com to name this workflow file.
on:
  push:
    tags: ["v*"]
  # Retry without cutting a new tag; useful while the trusted publisher
  # configuration is still being validated.
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token the registry exchanges for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm for install/build: package.json pins pnpm in devEngines, so npm
      # refuses to run inside this repo (EBADDEVENGINES).
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      # Deliberately NO registry-url and no token: setup-node would write
      # '//registry.npmjs.org/:_authToken=...' pointing at NODE_AUTH_TOKEN (the
      # GitHub token), and a token in .npmrc shadows the OIDC exchange. npm
      # already defaults to registry.npmjs.org.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi

      - name: OIDC is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC token: permissions.id-token: write is missing." >&2
            exit 1
          fi
          echo "node $(node -v) / npm $(npm -v)"
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:-<unset>}"

      # Build the tarball with pnpm (prepack rebuilds dist and runs publint),
      # then publish it with npm from a neutral directory: only the npm CLI
      # performs the OIDC token exchange, and npm cannot run inside this repo.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - run: cd "$RUNNER_TEMP" && npm publish puresv-*.tgz

      # If the publish above fails, print what the registry actually sees so the
      # mismatch is visible instead of guessed at.
      - name: Diagnose the trusted publisher
        if: failure()
        run: |
          set +e
          echo "--- OIDC claims sent to npm ---"
          ID=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$ID" | python3 -c 'import sys,base64,json; p=sys.stdin.read().strip().split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ("repository","repository_owner","workflow_ref","job_workflow_ref","environment","ref","event_name")}, indent=1))'
          echo "--- does the publisher allow npm stage publish? ---"
          cd "$RUNNER_TEMP" && npm stage publish puresv-*.tgz --dry-run
